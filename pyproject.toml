[project]
name = "fishtest-spsa-lab"
version = "0.1.0"
description = "Simulation and validation laboratory for Fishtest SPSA optimizers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishtest_spsa_lab"]
# vendor/pentamodel/optimize.py imports nevergrad, which is not a dependency and
# is not in the lock, so the module is unimportable. Shipping it in the wheel
# advertises an entry point that raises ModuleNotFoundError on first use.
exclude = ["src/fishtest_spsa_lab/vendor/pentamodel/optimize.py"]

[project.scripts]
validate-spsa = "fishtest_spsa_lab.analysis.validate_spsa:main"
validate-sf-sgd-block = "fishtest_spsa_lab.analysis.validate_sf_sgd:main"
validate-sf-adam-block = "fishtest_spsa_lab.analysis.validate_sf_adam:main"
validate-spsa-u2 = "fishtest_spsa_lab.analysis.validate_spsa_u2:main"
validate-variance = "fishtest_spsa_lab.analysis.validate_variance:main"
validate-adam = "fishtest_spsa_lab.analysis.validate_adam:main"
validate-penta = "fishtest_spsa_lab.analysis.validate_pentanomial:main"
optimize-spsa-toy = "fishtest_spsa_lab.analysis.optimize_spsa_toy:main"
noise-ball = "fishtest_spsa_lab.analysis.noise_ball:main"
run-simulation = "fishtest_spsa_lab.simulator.main:main"
plot-spsa-schedule = "fishtest_spsa_lab.analysis.plot_spsa_schedule:main"
rademacher = "fishtest_spsa_lab.analysis.rademacher:main"
spsa-gradient = "fishtest_spsa_lab.analysis.spsa_gradient:main"
spsa-design = "fishtest_spsa_lab.analysis.design:main"

[tool.ruff]
# Only vendored third-party code is excluded. docs/ and __DEV/ stay in scope so
# that ruff >=0.16 formats the Python blocks inside their Markdown. Only
# ```python fences are touched; ```text, ```bash and ```c are left alone.
exclude = [
    "src/fishtest_spsa_lab/vendor",
]

[tool.ruff.lint]
# Pin the rule set instead of inheriting ruff's defaults, which changed from 59
# to 413 rules in 0.16.0. These four are the pre-0.16 default selection.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
exclude = [
    "src/fishtest_spsa_lab/vendor",
    "docs",
]
